server {
    listen 80;
    server_name read.top www.read.top;

    return 301 https://www.read.top$request_uri;
}

server {
    listen 443 ssl;
    server_name www.read.top read.top;

    ssl_certificate /www/wwwroot/read.top/https/fullchain.pem;
    ssl_certificate_key /www/wwwroot/read.top/https/privkey.key;

    ssl_session_timeout 5m;
    ssl_session_cache shared:SSL:1m;

    ssl_protocols TLSv1.2;
    ssl_ciphers HIGH:!RC4:!MD5:!aNULL:!eNULL:!NULL:!DH:!EDH:!EXP:+MEDIUM;
    ssl_prefer_server_ciphers on;

    # 网站静态文件根目录
    root /www/wwwroot/read.top;
    index index.html index.htm;

    # Apple Universal Links 验证文件
    location = /.well-known/apple-app-site-association {
        default_type application/json;
        add_header Access-Control-Allow-Origin *;
    }

    # API 请求继续转发到后端
    location /api/ {
        proxy_pass http://127.0.0.1:5006/api/;

        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 兼容直接访问 /api，不带结尾斜杠
    location = /api {
        proxy_pass http://127.0.0.1:5006/api;

        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 除 /api 之外，全部从静态目录读取
    location / {
        try_files $uri $uri/ =404;
    }

    # 禁止访问隐藏文件，例如 .git、.env
    location ~ /\.(?!well-known) {
        deny all;
    }
}
